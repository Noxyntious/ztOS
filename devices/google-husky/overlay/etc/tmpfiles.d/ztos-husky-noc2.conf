# husky: the APM firmware (flexpmu) halts on a core power-down race in the C2 idle
# state about once per 30-250 suspend cycles (husky-port-notes, ACPM HANG hunt).
# Only cpu8 (X3) is affected; the DT also drops its idle state (backstop for older DTBs).
w /sys/devices/system/cpu/cpu8/cpuidle/state1/disable - - - - 1
